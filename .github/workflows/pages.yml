name: Deploy exam runner to Pages

# app/bank.json is a built artifact. Rebuilding it here rather than trusting the
# committed copy means the deployed app can never drift from the item bank - and
# because build_bank.py runs validate.py first and refuses on red, a bank that
# fails its own quality checks cannot reach the site.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Engine tests
        run: node --test

      - name: Validate the item bank
        run: python3 scripts/validate.py

      - name: Report coverage
        run: python3 scripts/stats.py

      - name: Rebuild app/bank.json and app/bank.js from the bank
        run: python3 scripts/build_bank.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
