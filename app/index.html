<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCNA 200-301 v1.1 — Practice Exam</title>
<link rel="stylesheet" href="styles.css">
<script>
  /* Apply a stored theme before first paint, so a dark-mode user is not flashed. */
  try {
    const t = (JSON.parse(localStorage.getItem('ccna-runner-v2')) || {}).prefs.theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* no storage: follow the system theme */ }
</script>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <span class="ident">CCNA 200-301 <small id="bar-ver">v1.1</small></span>
    <div class="bar-right">
      <span class="timer" id="timer" role="timer" aria-live="off" hidden><span class="lbl">remaining</span><span id="timer-val">--:--</span></span>
      <button type="button" class="theme-btn" id="theme" aria-label="Colour theme">Theme: auto</button>
    </div>
  </div>
</header>

<main id="app" tabindex="-1">
  <noscript><div class="notice warn">This practice exam needs JavaScript.</div></noscript>
</main>

<!-- bank.js, not a fetch of bank.json: fetch() is blocked when this page is
     opened from disk over file://, a plain script tag is not. -->
<script src="bank.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
